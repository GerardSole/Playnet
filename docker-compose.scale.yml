# Multi-instance override for docker-compose.yml.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.scale.yml up --scale api=3
#
# This overlay:
#   1. Removes the direct host-port binding from the api service so multiple
#      containers can start without port conflicts.
#   2. Adds an nginx reverse-proxy that:
#        - Exposes port 3000 on the host (same port as the single-instance setup,
#          so client configuration does not change).
#        - Load-balances across all api containers.
#        - Uses ip_hash sticky sessions for Socket.IO polling transport support.
#   3. Keeps the Redis Adapter configuration transparent — no extra env vars are
#      needed because the adapter reuses the existing REDIS_URL.
#
# Prerequisites:
#   - @socket.io/redis-adapter is already installed and configured in gateway.plugin.ts.
#   - Redis is running (satisfied by the base docker-compose.yml).

services:
  api:
    # Remove the direct host-port mapping so N replicas can start in parallel.
    # Traffic now enters exclusively through nginx.
    ports: []

  nginx:
    image: nginx:1.27-alpine
    container_name: playnet-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - playnet-net
    restart: unless-stopped
