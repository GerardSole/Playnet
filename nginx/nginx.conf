# Nginx reverse-proxy / load balancer for Playnet multi-instance deployment.
#
# Run multiple API instances:
#   docker-compose -f docker-compose.yml -f docker-compose.scale.yml up --scale api=3
#
# Sticky sessions (ip_hash) are required only when the polling transport is
# used — a polling Socket.IO session must reach the same backend for every
# HTTP request within the same handshake sequence.  WebSocket connections are
# persistent and do not need sticky sessions because each TCP connection stays
# on the same instance for its entire lifetime.
#
# With the Redis Adapter in place, events emitted on any instance are relayed
# to all other instances via Redis Pub/Sub, so application state is consistent
# regardless of which backend handles a request.

upstream playnet_api {
    # ip_hash ensures clients are routed consistently to the same backend.
    # Required for Socket.IO polling transport compatibility.
    ip_hash;

    # Docker Compose internal DNS resolves "api" to all running api containers.
    # Add resolver so nginx re-queries Docker DNS after TTL to pick up new
    # containers started with --scale.
    server api:3000;
}

server {
    listen 80;

    # ── WebSocket + HTTP proxy ────────────────────────────────────────────────
    location / {
        proxy_pass         http://playnet_api;
        proxy_http_version 1.1;

        # WebSocket upgrade — must be set for both the initial upgrade request
        # and subsequent frames.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarding headers — app.ts has trustProxy: true so Fastify reads
        # the real client IP from X-Forwarded-For.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout so persistent WebSocket connections are not dropped.
        # Nginx defaults (60s) would kill long-lived game connections.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffer tuning: disable buffering for real-time event streams.
        proxy_buffering    off;
    }

    # ── Health check passthrough ──────────────────────────────────────────────
    location /health {
        proxy_pass http://playnet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # No timeout override — health checks should be fast
    }
}
